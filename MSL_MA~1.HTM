<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSL Manpower Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF1ED;
    --surface:#FFFFFF;
    --surface-2:#F6F7F4;
    --ink:#14181A;
    --ink-soft:#5B6560;
    --ink-faint:#8B948E;
    --line:#DCE3DD;
    --line-soft:#E8ECE7;
    --emerald:#0B6E4F;
    --emerald-soft:#E4F1EA;
    --amber:#C97A1A;
    --amber-soft:#FBEEDD;
    --rose:#B23A48;
    --rose-soft:#F8E9EA;
    --navy:#24425F;
    --navy-soft:#E7ECF1;
    --maroon:#7A2E2E;
    --maroon-soft:#F1E2DE;
    --pregnant:#C23B8F;
    --pregnant-soft:#FBE7F2;
    --oic:#A67C00;
    --oic-soft:#FBF1D6;
    --radius:10px;
    --shadow:0 1px 2px rgba(20,24,26,0.06), 0 4px 14px rgba(20,24,26,0.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', -apple-system, sans-serif;
    font-size:14px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:1240px;margin:0 auto;padding:20px 20px 100px;}

  .mono{font-family:'IBM Plex Mono', monospace;}

  /* header */
  .topbar{
    display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between;
    gap:16px; margin-bottom:20px; padding-bottom:16px; border-bottom:1px solid var(--line);
  }
  .brand h1{
    font-family:'Fraunces', serif; font-weight:600; font-size:26px; margin:0 0 2px;
    letter-spacing:-0.01em;
  }
  .brand .sub{color:var(--ink-soft); font-size:12.5px;}
  .brand .sub .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--emerald);margin-right:6px;position:relative;top:-1px;}

  .topbar-right{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .search-box{
    display:flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--line);
    border-radius:8px; padding:7px 10px; min-width:200px;
  }
  .search-box input{border:none; outline:none; font-family:inherit; font-size:13px; width:100%; background:transparent; color:var(--ink);}
  .search-box svg{flex-shrink:0; opacity:0.5;}

  .tabs{display:flex; gap:4px; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:3px;}
  .tab-btn{
    border:none; background:transparent; padding:6px 12px; border-radius:6px; font-family:inherit;
    font-size:12.5px; font-weight:500; color:var(--ink-soft); cursor:pointer; white-space:nowrap;
  }
  .tab-btn.active{background:var(--ink); color:#fff;}

  /* stat strip */
  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(148px,1fr)); gap:12px; margin-bottom:18px;}
  .stat-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 16px; box-shadow:var(--shadow);
  }
  .stat-card .label{font-size:11.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-faint); margin-bottom:8px; font-weight:600;}
  .stat-card .val{font-family:'IBM Plex Mono', monospace; font-size:28px; font-weight:600; letter-spacing:-0.01em;}
  .stat-card .val.emerald{color:var(--emerald);}
  .stat-card .val.amber{color:var(--amber);}
  .stat-card .val.rose{color:var(--rose);}

  /* section header */
  .section-head{display:flex; align-items:center; justify-content:space-between; margin:26px 0 10px;}
  .section-head h2{font-family:'Fraunces', serif; font-size:17px; font-weight:600; margin:0;}
  .section-head .count-pill{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-soft); background:var(--surface-2); border:1px solid var(--line-soft); border-radius:20px; padding:2px 9px;}

  /* branch table */
  .branch-table{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow);}
  .branch-row{border-bottom:1px solid var(--line-soft);}
  .branch-row:last-child{border-bottom:none;}
  .branch-main{
    display:grid; grid-template-columns:26px 2fr repeat(4,64px) 1.4fr 24px;
    align-items:center; gap:10px; padding:11px 14px; cursor:pointer;
  }
  .branch-main:hover{background:var(--surface-2);}
  .branch-idx{color:var(--ink-faint); font-family:'IBM Plex Mono',monospace; font-size:11px;}
  .branch-name-wrap .bname{font-weight:600; font-size:13.5px;}
  .branch-name-wrap .bgroup{
    display:inline-block; margin-top:2px; font-size:10px; font-weight:600; letter-spacing:0.04em;
    padding:1px 6px; border-radius:4px; text-transform:uppercase;
  }
  .bgroup.BANGS{background:var(--navy-soft); color:var(--navy);}
  .bgroup.TNJ{background:var(--emerald-soft); color:var(--emerald);}

  .counter-chip{
    font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:14px; text-align:center;
    background:var(--ink); color:#fff; border-radius:6px; padding:5px 0; letter-spacing:0.02em;
  }
  .counter-chip.zero{background:var(--surface-2); color:var(--ink-faint); font-weight:600;}
  .counter-col-label{font-size:9px; text-align:center; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.04em; margin-top:3px;}

  .vac-wrap{display:flex; gap:5px; flex-wrap:wrap; align-items:center;}
  .vac-chip{
    font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; padding:3px 7px; border-radius:20px;
    background:var(--amber-soft); color:var(--amber); border:1px solid transparent; cursor:pointer;
  }
  .vac-chip.empty{background:transparent; color:var(--ink-faint); border:1px dashed var(--line);}
  .remarks-txt{font-size:11.5px; color:var(--ink-soft); font-style:italic; margin-top:3px; max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  .chevron{transition:transform 0.15s ease; color:var(--ink-faint);}
  .branch-row.open .chevron{transform:rotate(90deg);}

  .branch-detail{display:none; padding:4px 14px 16px 50px; background:var(--surface-2);}
  .branch-row.open .branch-detail{display:block;}

  .detail-toolbar{display:flex; justify-content:space-between; align-items:center; margin:8px 0 10px;}
  .detail-toolbar .edit-vac-btn, .add-emp-btn{
    font-family:inherit; font-size:11.5px; font-weight:600; border:1px solid var(--line); background:#fff;
    color:var(--ink); padding:5px 10px; border-radius:6px; cursor:pointer;
  }
  .add-emp-btn{background:var(--ink); color:#fff; border-color:var(--ink);}

  .emp-table{width:100%; border-collapse:collapse; font-size:12.5px;}
  .emp-table th{
    text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-faint);
    padding:5px 8px; border-bottom:1px solid var(--line);
  }
  .emp-table td{padding:6px 8px; border-bottom:1px solid var(--line-soft); vertical-align:middle;}
  .emp-table tr:last-child td{border-bottom:none;}
  .emp-name{font-weight:600;}
  .emp-name .ph{font-weight:400; color:var(--ink-faint); font-style:italic;}
  .status-badge{
    display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:600; padding:2px 8px;
    border-radius:20px; text-transform:uppercase; letter-spacing:0.03em;
  }
  .status-badge.Active{background:var(--emerald-soft); color:var(--emerald);}
  .status-badge.Borrowed{background:var(--amber-soft); color:var(--amber);}
  .status-badge.Resigned{background:var(--rose-soft); color:var(--rose);}
  .emp-actions{display:flex; gap:4px; flex-wrap:wrap;}
  .mini-btn{
    font-family:inherit; font-size:10.5px; font-weight:600; border:1px solid var(--line); background:#fff;
    padding:3px 7px; border-radius:5px; cursor:pointer; color:var(--ink-soft);
  }
  .mini-btn:hover{border-color:var(--ink); color:var(--ink);}
  .mini-btn.danger:hover{border-color:var(--rose); color:var(--rose);}

  /* floating buttons */
  .fab-row{position:fixed; right:22px; bottom:22px; display:flex; flex-direction:column; gap:10px; z-index:40;}
  .fab{
    font-family:inherit; font-weight:600; font-size:13px; border:none; border-radius:30px; cursor:pointer;
    padding:12px 18px; box-shadow:0 6px 20px rgba(20,24,26,0.22); display:flex; align-items:center; gap:8px;
  }
  .fab.primary{background:var(--emerald); color:#fff;}
  .fab.secondary{background:#fff; color:var(--ink); border:1px solid var(--line);}

  /* modal */
  .overlay{
    position:fixed; inset:0; background:rgba(20,24,26,0.45); display:none; align-items:flex-start;
    justify-content:center; padding:6vh 16px; z-index:100; overflow-y:auto;
  }
  .overlay.show{display:flex;}
  .modal{
    background:#fff; border-radius:14px; width:100%; max-width:440px; padding:22px; box-shadow:0 20px 60px rgba(0,0,0,0.25);
  }
  .modal h3{font-family:'Fraunces', serif; margin:0 0 4px; font-size:19px;}
  .modal .modal-sub{color:var(--ink-soft); font-size:12.5px; margin-bottom:16px;}
  .field{margin-bottom:13px;}
  .field label{display:block; font-size:11.5px; font-weight:600; color:var(--ink-soft); margin-bottom:5px; text-transform:uppercase; letter-spacing:0.03em;}
  .field input, .field select, .field textarea{
    width:100%; border:1px solid var(--line); border-radius:7px; padding:8px 10px; font-family:inherit;
    font-size:13.5px; color:var(--ink); background:var(--surface-2);
  }
  .field textarea{resize:vertical; min-height:50px;}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:18px;}
  .btn{font-family:inherit; font-weight:600; font-size:13px; border-radius:7px; padding:8px 16px; cursor:pointer; border:1px solid var(--line); background:#fff; color:var(--ink);}
  .btn.primary{background:var(--ink); color:#fff; border-color:var(--ink);}
  .btn.danger{background:var(--rose); color:#fff; border-color:var(--rose);}
  .modal-note{font-size:11.5px; background:var(--surface-2); border:1px solid var(--line-soft); border-radius:8px; padding:8px 10px; color:var(--ink-soft); margin-bottom:13px;}

  /* history panel */
  .history-overlay{position:fixed; inset:0; background:rgba(20,24,26,0.35); display:none; z-index:90;}
  .history-overlay.show{display:block;}
  .history-panel{
    position:fixed; top:0; right:0; bottom:0; width:380px; max-width:92vw; background:#fff; z-index:95;
    box-shadow:-8px 0 30px rgba(0,0,0,0.15); transform:translateX(100%); transition:transform 0.25s ease;
    display:flex; flex-direction:column;
  }
  .history-panel.show{transform:translateX(0);}
  .history-head{padding:18px 18px 12px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;}
  .history-head h3{font-family:'Fraunces', serif; margin:0; font-size:17px;}
  .history-close{border:none; background:transparent; cursor:pointer; color:var(--ink-soft); font-size:18px;}
  .history-list{overflow-y:auto; padding:8px 18px 18px; flex:1;}
  .hist-item{padding:10px 0; border-bottom:1px solid var(--line-soft);}
  .hist-item:last-child{border-bottom:none;}
  .hist-type{
    display:inline-block; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em;
    padding:1px 7px; border-radius:4px; margin-bottom:5px;
  }
  .hist-type.Hired{background:var(--emerald-soft); color:var(--emerald);}
  .hist-type.Transferred{background:var(--navy-soft); color:var(--navy);}
  .hist-type.Borrowed{background:var(--amber-soft); color:var(--amber);}
  .hist-type.Returned{background:var(--emerald-soft); color:var(--emerald);}
  .hist-type.Resigned{background:var(--rose-soft); color:var(--rose);}
  .hist-type.Edited{background:var(--surface-2); color:var(--ink-soft);}
  .hist-desc{font-size:12.5px; line-height:1.4;}
  .hist-meta{font-size:10.5px; color:var(--ink-faint); margin-top:3px; font-family:'IBM Plex Mono',monospace;}

  /* MSL standard bar */
  .mslbar{font-size:11.5px; color:var(--ink-soft); display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:-6px 0 14px;}
  .mslbar .msl-edit-btn{
    font-family:inherit; font-size:11px; font-weight:600; border:1px solid var(--line); background:#fff;
    padding:3px 10px; border-radius:6px; cursor:pointer; color:var(--ink);
  }
  .msl-flag{
    display:inline-block; font-size:9px; font-weight:700; color:var(--maroon); background:var(--maroon-soft);
    padding:1px 6px; border-radius:4px; margin-left:6px; text-transform:uppercase; letter-spacing:0.03em; vertical-align:middle;
  }

  .status-badge.AWOL{background:var(--maroon-soft); color:var(--maroon);}
  .status-badge.Resigning{background:var(--amber-soft); color:var(--amber);}
  .hist-type.AWOL{background:var(--maroon-soft); color:var(--maroon);}
  .hist-type.ReportedBack{background:var(--emerald-soft); color:var(--emerald);}
  .hist-type.Pregnant{background:var(--pregnant-soft); color:var(--pregnant);}
  .hist-type.Resigning{background:var(--amber-soft); color:var(--amber);}
  .hist-type.Note{background:var(--surface-2); color:var(--ink-soft);}

  .hist-actions{display:flex; gap:2px; flex-shrink:0;}
  .hist-edit{
    border:none; background:transparent; color:var(--ink-faint); cursor:pointer; font-size:12px; line-height:1;
    padding:2px 4px;
  }
  .hist-edit:hover{color:var(--ink);}
  .add-entry-btn{
    font-family:inherit; font-size:11.5px; font-weight:600; border:1px solid var(--line); background:#fff;
    padding:5px 10px; border-radius:6px; cursor:pointer; color:var(--ink); margin-bottom:10px; width:100%;
  }

  .emp-name.is-pregnant{color:var(--pregnant); font-weight:700;}
  .emp-name.is-oic{color:var(--oic); font-weight:700;}
  .emp-name .preg-icon{margin-right:3px; color:var(--pregnant);}
  .emp-name .oic-icon{margin-right:3px; color:var(--oic);}
  .emp-contact{display:block; font-size:10px; font-weight:400; color:var(--ink-faint); margin-top:1px;}
  .hist-type.OIC{background:var(--oic-soft); color:var(--oic);}

  .stat-card.clickable{cursor:pointer;}
  .stat-card.clickable:hover{border-color:var(--pregnant);}
  .breakdown-row{display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--line-soft); font-size:13px;}
  .breakdown-row:last-child{border-bottom:none;}
  .breakdown-row .bd-count{font-family:'IBM Plex Mono',monospace; font-weight:700; background:var(--pregnant-soft); color:var(--pregnant); padding:2px 9px; border-radius:20px; font-size:12px;}
  .breakdown-names{font-size:11px; color:var(--ink-soft); margin-top:2px;}

  .hist-item{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
  .hist-item-body{flex:1; min-width:0;}
  .hist-del{
    border:none; background:transparent; color:var(--ink-faint); cursor:pointer; font-size:14px; line-height:1;
    padding:2px 4px; flex-shrink:0;
  }
  .hist-del:hover{color:var(--rose);}

  .empty-state{padding:30px; text-align:center; color:var(--ink-faint); font-size:13px;}

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:#fff;
    padding:9px 18px; border-radius:30px; font-size:12.5px; font-weight:500; opacity:0; pointer-events:none;
    transition:all 0.25s ease; z-index:200;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  @media (max-width:760px){
    .stats{grid-template-columns:repeat(2,1fr);}
    .branch-main{grid-template-columns:20px 1.6fr repeat(4,42px) 20px;}
    .vac-wrap, .remarks-txt{display:none;}
    .branch-detail{padding-left:14px;}
    .emp-table{font-size:11.5px;}
    .emp-table th:nth-child(4), .emp-table td:nth-child(4){display:none;}
  }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">
      <h1>MSL Manpower Tracker</h1>
      <div class="sub"><span class="dot"></span><span id="lastUpdated">loading…</span></div>
    </div>
    <div class="topbar-right">
      <div class="search-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" type="text" placeholder="Search branch or employee…">
      </div>
      <div class="tabs" id="groupTabs">
        <button class="tab-btn active" data-group="ALL">All</button>
        <button class="tab-btn" data-group="BANGS">BANGS</button>
        <button class="tab-btn" data-group="TNJ">T&amp;J</button>
      </div>
      <button class="mini-btn" id="historyBtn" style="padding:7px 12px;">Activity Log</button>
      <button class="mini-btn" id="archiveBtn" style="padding:7px 12px;">Removed Employees</button>
    </div>
  </div>

  <div class="stats" id="statsRow"></div>

  <div class="section-head">
    <h2>Branches</h2>
    <div style="display:flex; align-items:center; gap:10px;">
      <span class="count-pill" id="branchCountPill">0 branches</span>
      <button class="msl-edit-btn" id="addBranchBtn">+ Add Branch</button>
    </div>
  </div>
  <div class="mslbar" id="mslBar"></div>
  <div class="branch-table" id="branchTable"></div>
</div>

<div class="fab-row">
  <button class="fab secondary" id="exportBtn">Export CSV</button>
  <button class="fab primary" id="newHireBtn">+ New Hire</button>
</div>

<div class="history-overlay" id="historyOverlay"></div>
<div class="history-panel" id="historyPanel">
  <div class="history-head"><h3>Activity Log</h3><button class="history-close" id="historyCloseBtn">✕</button></div>
  <div style="padding:12px 18px 0;"><button class="add-entry-btn" id="addEntryBtn">+ Add Entry</button></div>
  <div class="history-list" id="historyList"></div>
</div>

<div class="overlay" id="modalOverlay">
  <div class="modal" id="modalBody"></div>
</div>

<div class="toast" id="toast"></div>

let state = null;
let ui = { group:'ALL', search:'', openBranches:new Set() };

const STORAGE_KEY = 'manpower_state_v1'; // fallback if cloud isn't configured yet
const ROW_ID = 1; // single shared row every device reads/writes

function uid(prefix){
  return prefix + Math.random().toString(36).slice(2,9);
}

function defaultState(){
  return {
    branches: SEED.branches.map(b=>({...b})),
    employees: SEED.employees.map(e=>({...e})),
    history: [{id:uid('H'), date:new Date().toISOString(), type:'Edited', desc:'System initialized from June 15, 2026 manpower summary.', meta:''}],
    mslTargets: {internPerStylist:2, internBase:1, Counter:2},
    archivedEmployees: [],
    updatedAt: new Date().toISOString()
  };
}

async function loadState(){
  try{
    if(db){
      const { data, error } = await db.from('tracker_state').select('data').eq('id', ROW_ID).single();
      if(error) throw error;
      state = data.data;
    } else {
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){ state = JSON.parse(raw); } else { throw new Error('no data yet'); }
    }
  }catch(e){
    state = defaultState();
    await saveState(false);
  }
  if(!state.mslTargets || state.mslTargets.internPerStylist===undefined){
    state.mslTargets = {internPerStylist:2, internBase:1, Counter:2};
  }
  if(!state.archivedEmployees) state.archivedEmployees = [];
  render();
}

async function saveState(showToast=true){
  state.updatedAt = new Date().toISOString();
  try{
    if(db){
      const { error } = await db.from('tracker_state')
        .upsert({ id: ROW_ID, data: state, updated_at: state.updatedAt });
      if(error) throw error;
    } else {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }
    if(showToast) flashToast('Saved');
  }catch(e){
    console.error(e);
    flashToast(db ? 'Save failed — check your internet connection' : 'Save failed — your browser storage may be full');
  }
}

function flashToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}

function addHistory(type, desc, meta){
  state.history.unshift({id:uid('H'), date:new Date().toISOString(), type, desc, meta: meta||''});
}
function addEmpHistory(emp, type, desc){
  if(!emp.history) emp.history = [];
  emp.history.unshift({id:uid('EH'), date:new Date().toISOString(), type, desc});
}
function autoFillVacancy(branchName, position){
  const b = state.branches.find(x=>x.name===branchName);
  if(!b) return;
  if(position==='Intern' && Number(b.vacInterns)>0) b.vacInterns = Number(b.vacInterns) - 1;
  if(position==='Counter' && Number(b.vacCounters)>0) b.vacCounters = Number(b.vacCounters) - 1;
}
function deleteHistoryEntry(histId){
  if(!confirm('Remove this log entry? This cannot be undone.')) return;
  state.history = state.history.filter(h=>h.id!==histId);
  saveState(); renderHistory();
}
function deleteEmpHistoryEntry(emp, entryId){
  if(!confirm('Remove this entry from her/his history? This cannot be undone.')) return;
  emp.history = (emp.history||[]).filter(h=>h.id!==entryId);
  saveState();
  openActionModal('viewhistory', emp.id);
}

function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('en-PH', {month:'short', day:'numeric', year:'numeric'}) + ' · ' + d.toLocaleTimeString('en-PH',{hour:'2-digit',minute:'2-digit'});
}

function branchGroupClass(g){ return g==='T&J' ? 'TNJ' : 'BANGS'; }

function activeEmployeesInBranch(branchName){
  return state.employees.filter(e=>e.currentBranch===branchName && e.status!=='Resigned' && e.status!=='AWOL');
}
function allEmployeesForBranch(branchName){
  // employees whose home or current branch is this branch (so borrowed-out staff still show at home)
  return state.employees.filter(e=> e.homeBranch===branchName || e.currentBranch===branchName);
}
function countByPosition(branchName){
  const emps = activeEmployeesInBranch(branchName);
  const c = {Intern:0, Counter:0, Stylist:0, BM:0};
  emps.forEach(e=>{ if(c[e.position]!==undefined) c[e.position]++; });
  return c;
}
function branchDeficit(branchName){
  const counts = countByPosition(branchName);
  const t = state.mslTargets;
  const internTarget = (Number(t.internPerStylist)||0) * counts.Stylist + (Number(t.internBase)||0);
  const counterCoverage = counts.Counter + counts.BM; // BM can cover a counter slot
  const d = {
    internTarget,
    Intern: Math.max(0, internTarget - counts.Intern),
    Counter: Math.max(0, (Number(t.Counter)||0) - counterCoverage)
  };
  d.any = d.Intern>0 || d.Counter>0;
  return d;
}

function computeStats(){
  const active = state.employees.filter(e=>e.status==='Active').length;
  const borrowed = state.employees.filter(e=>e.status==='Borrowed').length;
  const awol = state.employees.filter(e=>e.status==='AWOL').length;
  const pregnant = state.employees.filter(e=>e.pregnant && e.status!=='Resigned').length;
  const resignedThisMonth = state.employees.filter(e=>{
    if(e.status!=='Resigned' || !e.dateResigned) return false;
    const d = new Date(e.dateResigned), now = new Date();
    return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear();
  }).length;
  let internsToFill = 0, countersToFill = 0, branchesBelowMSL = 0;
  state.branches.forEach(b=>{
    const d = branchDeficit(b.name);
    internsToFill += d.Intern;
    countersToFill += d.Counter;
    if(d.any) branchesBelowMSL++;
  });
  return {active, borrowed, awol, pregnant, resignedThisMonth, internsToFill, countersToFill, branchesBelowMSL};
}

function renderStats(){
  const s = computeStats();
  document.getElementById('statsRow').innerHTML = `
    <div class="stat-card"><div class="label">Active Staff</div><div class="val emerald mono">${s.active}</div></div>
    <div class="stat-card clickable" id="pregnantStatCard"><div class="label">Pregnant (tap for breakdown)</div><div class="val mono" style="color:var(--pregnant);">${s.pregnant}</div></div>
    <div class="stat-card clickable" id="belowMslStatCard"><div class="label">Branches Below MSL (tap for list)</div><div class="val rose mono">${s.branchesBelowMSL}</div></div>
    <div class="stat-card"><div class="label">Interns to Fill</div><div class="val amber mono">${s.internsToFill}</div></div>
    <div class="stat-card"><div class="label">Counters to Fill</div><div class="val amber mono">${s.countersToFill}</div></div>
  `;
  document.getElementById('pregnantStatCard').onclick = openPregnantBreakdown;
  document.getElementById('belowMslStatCard').onclick = openBelowMslList;
  document.getElementById('archiveBtn').textContent = `Removed Employees (${state.archivedEmployees.length})`;
  const t = state.mslTargets;
  document.getElementById('mslBar').innerHTML = `
    <span>MSL standard: <strong class="mono">Intern = ${t.internPerStylist}×Stylist + ${t.internBase}</strong> · <strong class="mono">${t.Counter}</strong> Counter/BM combined per branch</span>
    <button class="msl-edit-btn" id="editMslBtn">Edit standard</button>
  `;
  document.getElementById('editMslBtn').onclick = openMslModal;
  document.getElementById('lastUpdated').textContent = 'Live · last saved ' + fmtDate(state.updatedAt);
}

function matchesSearch(branch){
  if(!ui.search) return true;
  const q = ui.search.toLowerCase();
  if(branch.name.toLowerCase().includes(q)) return true;
  const emps = allEmployeesForBranch(branch.name);
  return emps.some(e=>e.name.toLowerCase().includes(q) || (e.hsName||'').toLowerCase().includes(q));
}

function renderBranches(){
  let branches = state.branches.filter(b=>{
    if(ui.group!=='ALL' && branchGroupClass(b.group)!==ui.group) return false;
    return matchesSearch(b);
  });
  document.getElementById('branchCountPill').textContent = branches.length + (branches.length===1?' branch':' branches');

  const html = branches.map((b, idx)=>{
    const counts = countByPosition(b.name);
    const deficit = branchDeficit(b.name);
    const isOpen = ui.openBranches.has(b.name);
    const vacI = Number(b.vacInterns)||0, vacC = Number(b.vacCounters)||0;
    const vacHtml = (vacI||vacC||b.remarks) ?
      `<div class="vac-wrap">
        ${vacI? `<span class="vac-chip" data-editvac="${encodeURIComponent(b.name)}">+${vacI} Intern</span>`:''}
        ${vacC? `<span class="vac-chip" data-editvac="${encodeURIComponent(b.name)}">+${vacC} Counter</span>`:''}
        ${(!vacI&&!vacC)? `<span class="vac-chip empty" data-editvac="${encodeURIComponent(b.name)}">no gaps</span>`:''}
      </div>
      ${b.remarks? `<div class="remarks-txt" title="${escapeHtml(b.remarks)}">${escapeHtml(b.remarks)}</div>`:''}`
      : `<span class="vac-chip empty" data-editvac="${encodeURIComponent(b.name)}">+ add note</span>`;

    return `
    <div class="branch-row ${isOpen?'open':''}" data-branch="${encodeURIComponent(b.name)}">
      <div class="branch-main" data-toggle="${encodeURIComponent(b.name)}">
        <div class="branch-idx mono">${idx+1}</div>
        <div class="branch-name-wrap">
          <div class="bname">${escapeHtml(b.name)}${deficit.any? `<span class="msl-flag" title="${escapeHtml(mslFlagTitle(deficit))}">Below MSL</span>`:''}</div>
          <span class="bgroup ${branchGroupClass(b.group)}">${b.group}</span>
        </div>
        <div><div class="counter-chip ${counts.BM?'':'zero'} mono">${counts.BM}</div><div class="counter-col-label">BM</div></div>
        <div><div class="counter-chip ${counts.Stylist?'':'zero'} mono">${counts.Stylist}</div><div class="counter-col-label">HS</div></div>
        <div><div class="counter-chip ${counts.Counter?'':'zero'} mono">${counts.Counter}</div><div class="counter-col-label">Counter</div></div>
        <div><div class="counter-chip ${counts.Intern?'':'zero'} mono">${counts.Intern}</div><div class="counter-col-label">Intern</div></div>
        <div>${vacHtml}</div>
        <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="9 6 15 12 9 18"/></svg>
      </div>
      <div class="branch-detail">${isOpen? renderBranchDetail(b) : ''}</div>
    </div>`;
  }).join('');

function renderBranchDetail(b){
  const emps = allEmployeesForBranch(b.name).sort((a,z)=>{
    const order = {Active:0, Borrowed:1, Resigning:2, AWOL:3, Resigned:4};
    const posOrder = {BM:0, Stylist:1, Counter:2, Intern:3};
    return (order[a.status]-order[z.status]) || (posOrder[a.position]-posOrder[z.position]);
  });
  const rows = emps.map(e=>{
    let locNote = '';
    if(e.status==='Borrowed'){
      const dayNote = e.borrowStart ? ` · Day ${daysBetween(e.borrowStart, todayStr())}` : '';
      const untilNote = e.expectedReturn ? ` (until ${e.expectedReturn})` : '';
      locNote = e.homeBranch===b.name
        ? `→ at ${escapeHtml(e.currentBranch)}${dayNote}${untilNote}`
        : `borrowed from ${escapeHtml(e.homeBranch)}${dayNote}${untilNote}`;
    } else if(e.status==='AWOL'){
      locNote = e.dateAwol ? `since ${e.dateAwol}` : '';
    } else if(e.status==='Resigning'){
      if(e.lastDay){
        const daysLeft = daysBetween(todayStr(), e.lastDay) - 1;
        locNote = daysLeft>0 ? `last day ${e.lastDay} · ${daysLeft} day${daysLeft===1?'':'s'} left` : `last day ${e.lastDay} · due today/overdue`;
      }
    } else if(e.homeBranch!==b.name && e.currentBranch===b.name){
      locNote = `home: ${escapeHtml(e.homeBranch)}`;
    }
    const showHsName = e.hsName && e.position==='Stylist';
    const boardName = showHsName
      ? escapeHtml(e.hsName)
      : (e.placeholder? `<span class="ph">${escapeHtml(e.name)}</span>` : escapeHtml(e.name));
    const subtitleParts = [];
    if(showHsName) subtitleParts.push('real: '+escapeHtml(e.name));
    if(e.contact) subtitleParts.push(escapeHtml(e.contact));
    const subtitleHtml = subtitleParts.length? `<span class="emp-contact">${subtitleParts.join(' · ')}</span>` : '';
    return `
    <tr>
      <td class="emp-name ${e.pregnant?'is-pregnant':(e.oic?'is-oic':'')}">${e.pregnant? `<span class="preg-icon">●</span>`:''}${e.oic? `<span class="oic-icon">●</span>`:''}${boardName}${subtitleHtml}</td>
      <td>${e.position}${e.rank? ` <span style="color:var(--ink-faint); font-size:11px;">(${escapeHtml(e.rank)})</span>`:''}</td>
      <td><span class="status-badge ${e.status}">${e.status}</span></td>
      <td class="mono" style="font-size:11px;color:var(--ink-faint);">${locNote}</td>
      <td>
        <div class="emp-actions">
          <button class="mini-btn" data-action="viewhistory" data-id="${e.id}">History</button>
          ${e.status!=='Resigned'? `<button class="mini-btn" data-action="rename" data-id="${e.id}">Edit Details</button>`:''}
          ${e.status==='Borrowed'? `<button class="mini-btn" data-action="return" data-id="${e.id}">Return</button>`:''}
          ${e.status==='AWOL'? `<button class="mini-btn" data-action="backfromawol" data-id="${e.id}">Report Back</button>`:''}
          ${e.status!=='Resigned'? `<button class="mini-btn" data-action="${e.pregnant?'unpregnant':'pregnant'}" data-id="${e.id}">${e.pregnant?'Unmark Pregnant':'Mark Pregnant'}</button>`:''}
          ${e.status!=='Resigned' && e.position==='Stylist'? `<button class="mini-btn" data-action="${e.oic?'unoic':'oic'}" data-id="${e.id}">${e.oic?'Remove OIC':'Mark OIC'}</button>`:''}
          <button class="mini-btn danger" data-action="archive" data-id="${e.id}">Remove from List</button>
        </div>
      </td>
    </tr>`;
  }).join('');

  return `
    <div class="detail-toolbar">
      <button class="edit-vac-btn" data-editvac="${encodeURIComponent(b.name)}">Edit Branch</button>
      <div style="display:flex; gap:8px;">
        <button class="add-emp-btn" data-addto="${encodeURIComponent(b.name)}">+ Add employee here</button>
        <button class="mini-btn danger" data-delbranch="${encodeURIComponent(b.name)}">Delete Branch</button>
      </div>
    </div>
    <table class="emp-table">
      <thead><tr><th>Name</th><th>Position</th><th>Status</th><th>Note</th><th></th></tr></thead>
      <tbody>${rows || `<tr><td colspan="5" style="color:var(--ink-faint);text-align:center;padding:14px;">No staff on record.</td></tr>`}</tbody>
    </table>
  `;
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function daysBetween(startStr, endStr){
  const a = new Date(startStr+'T00:00:00'), z = new Date(endStr+'T00:00:00');
  return Math.max(1, Math.round((z-a)/86400000)+1);
}

function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function mslFlagTitle(d){
  const parts = [];
  if(d.Intern>0) parts.push(`short ${d.Intern} Intern (needs ${d.internTarget})`);
  if(d.Counter>0) parts.push(`short ${d.Counter} Counter/BM coverage`);
  return parts.join(', ');
}

}

function branchOptions(selected){
  return state.branches.map(b=>`<option value="${escapeHtml(b.name)}" ${b.name===selected?'selected':''}>${escapeHtml(b.name)} (${b.group})</option>`).join('');
}

function openModal(html){
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('show');
}

function openHireModal(branchName){
  openModal(`
    <h3>New Hire</h3>
    <div class="modal-sub">Add a new employee and assign them to a branch.</div>
    <div class="field"><label>Full Name</label><input type="text" id="f_name" placeholder="e.g. Maria Santos" autofocus></div>
    <div class="field-row">
      <div class="field"><label>Position</label>
        <select id="f_position">
          <option>Counter</option><option>Intern</option><option>Stylist</option><option>BM</option>
        </select>
      </div>
      <div class="field"><label>Branch</label>
        <select id="f_branch">${branchOptions(branchName)}</select>
      </div>
    </div>
    <div class="field"><label>Contact Number (optional)</label><input type="text" id="f_contact" placeholder="e.g. 0917 123 4567"></div>
    <div class="field" id="hsNameFieldWrap" style="display:none;"><label>HS Name</label><input type="text" id="f_hsname" placeholder="board display name for this Stylist"></div>
    <div class="field" id="rankFieldWrap" style="display:none;"><label>Rank</label><select id="f_rank"></select></div>
    <div class="field"><label>Remarks (optional)</label><textarea id="f_remarks" placeholder="e.g. replacing resigned staff"></textarea></div>
    <div class="modal-actions">
      <button class="btn" id="cancelBtn">Cancel</button>
      <button class="btn primary" id="submitBtn">Add Employee</button>
    </div>
  `);
  const togglePosField = ()=>{
    const pos = document.getElementById('f_position').value;
    document.getElementById('hsNameFieldWrap').style.display = pos==='Stylist' ? '' : 'none';
    const rankWrap = document.getElementById('rankFieldWrap');
    if(pos==='Counter' || pos==='Intern'){
      rankWrap.style.display = '';
      document.getElementById('f_rank').innerHTML = rankOptionsFor(pos, '');
    } else {
      rankWrap.style.display = 'none';
    }
  };
  document.getElementById('f_position').addEventListener('change', togglePosField);
  togglePosField();
  document.getElementById('cancelBtn').onclick = closeModal;
  document.getElementById('submitBtn').onclick = ()=>{
    const name = document.getElementById('f_name').value.trim();
    if(!name){ flashToast('Enter a name'); return; }
    const position = document.getElementById('f_position').value;
    const branch = document.getElementById('f_branch').value;
    const contact = document.getElementById('f_contact').value.trim();
    const hsName = position==='Stylist' ? document.getElementById('f_hsname').value.trim() : '';
    const rank = (position==='Counter'||position==='Intern') ? document.getElementById('f_rank').value : '';
    const remarks = document.getElementById('f_remarks').value.trim();
    const emp = {id:uid('E'), name, position, homeBranch:branch, currentBranch:branch, status:'Active', placeholder:false, contact, hsName, rank, remarks, history:[]};
    state.employees.push(emp);
    addHistory('Hired', `${name} hired as ${position}${rank? ' ('+rank+')':''} at ${branch}.`, remarks);
    addEmpHistory(emp, 'Hired', `Hired as ${position}${rank? ' ('+rank+')':''} at ${branch}.`);
    autoFillVacancy(branch, position);
    ui.openBranches.add(branch);
    saveState();
    render();
    closeModal();
  };
}

function openVacModal(branchName){
  const b = state.branches.find(x=>x.name===branchName);
  if(!b) return;
  openModal(`
    <h3>Edit Branch</h3>
    <div class="modal-sub">Branch details, open manpower requests, and notes.</div>
    <div class="field-row">
      <div class="field"><label>Branch Name</label><input type="text" id="f_bname" value="${escapeHtml(b.name)}"></div>
      <div class="field"><label>Group</label>
        <select id="f_bgroup">
          <option value="T&J" ${b.group==='T&J'?'selected':''}>T&amp;J</option>
          <option value="BANGS" ${b.group==='BANGS'?'selected':''}>BANGS</option>
        </select>
      </div>
    </div>
    <div class="field-row">
      <div class="field"><label>Interns needed (ad hoc)</label><input type="number" min="0" id="f_vi" value="${b.vacInterns||0}"></div>
      <div class="field"><label>Counters needed (ad hoc)</label><input type="number" min="0" id="f_vc" value="${b.vacCounters||0}"></div>
    </div>
    <div class="field"><label>Remarks</label><textarea id="f_rmk" placeholder="e.g. staff on maternity leave">${escapeHtml(b.remarks||'')}</textarea></div>
    <div class="modal-actions">
      <button class="btn" id="cancelBtn">Cancel</button>
      <button class="btn primary" id="submitBtn">Save</button>
    </div>
  `);
  document.getElementById('cancelBtn').onclick = closeModal;
  document.getElementById('submitBtn').onclick = ()=>{
    const newName = document.getElementById('f_bname').value.trim();
    if(!newName){ flashToast('Enter a branch name'); return; }
    if(newName.toLowerCase()!==branchName.toLowerCase() && state.branches.some(x=>x.name.toLowerCase()===newName.toLowerCase())){
      flashToast('A branch with that name already exists'); return;
    }
    const newGroup = document.getElementById('f_bgroup').value;
    const oldName = b.name;
    if(newName!==oldName){
      state.employees.forEach(e=>{
        if(e.homeBranch===oldName) e.homeBranch = newName;
        if(e.currentBranch===oldName) e.currentBranch = newName;
      });
      if(ui.openBranches.has(oldName)){ ui.openBranches.delete(oldName); ui.openBranches.add(newName); }
    }
    b.name = newName;
    b.group = newGroup;
    b.vacInterns = Number(document.getElementById('f_vi').value)||0;
    b.vacCounters = Number(document.getElementById('f_vc').value)||0;
    b.remarks = document.getElementById('f_rmk').value.trim();
    const changeNote = newName!==oldName ? ` Renamed from "${oldName}".` : '';
    addHistory('Edited', `Updated branch details for ${newName}.${changeNote}`, `Intern:${b.vacInterns} Counter:${b.vacCounters}`);
    saveState();
    render();
    closeModal();
  };
}

function openDeleteBranchModal(branchName){
  const b = state.branches.find(x=>x.name===branchName);
  if(!b) return;
  const linked = state.employees.filter(e=>e.homeBranch===branchName || e.currentBranch===branchName);
  if(linked.length>0){
    openModal(`
      <h3>Can't Delete ${escapeHtml(branchName)}</h3>
      <div class="modal-sub">${linked.length} employee${linked.length===1?'':'s'} ${linked.length===1?'is':'are'} still linked to this branch (including resigned records).</div>
      <div class="modal-note">Transfer active staff to another branch first. Resigned/historical records don't need to move, but as long as any employee still references this branch, it can't be deleted — that keeps their history intact.</div>
      <div class="modal-actions"><button class="btn primary" id="cancelBtn">Got it</button></div>
    `);
    document.getElementById('cancelBtn').onclick = closeModal;
    return;
  }
  openModal(`
    <h3>Delete ${escapeHtml(branchName)}?</h3>
    <div class="modal-sub">This branch has no employees linked to it. Deleting it is permanent.</div>
    <div class="modal-actions"><button class="btn" id="cancelBtn">Cancel</button><button class="btn danger" id="submitBtn">Delete Branch</button></div>
  `);
  document.getElementById('cancelBtn').onclick = closeModal;
  document.getElementById('submitBtn').onclick = ()=>{
    state.branches = state.branches.filter(x=>x.name!==branchName);
    ui.openBranches.delete(branchName);
    addHistory('Edited', `Deleted branch "${branchName}".`, '');
    saveState(); render(); closeModal();
    flashToast('Branch deleted');
  };
}

function openActionModal(action, empId){
  const emp = state.employees.find(x=>x.id===empId);
  if(!emp) return;

  if(action==='viewhistory'){
    currentHistoryEmpId = emp.id;
    panelMode = 'emp';
    document.getElementById('historyPanel').querySelector('h3').textContent = emp.name + ' — History';
    document.getElementById('addEntryBtn').style.display = '';
    const rows = (emp.history||[]).map(h=>`
      <div class="hist-item">
        <div class="hist-item-body">
          <span class="hist-type ${h.type}">${h.type}</span>
          <div class="hist-desc">${escapeHtml(h.desc)}</div>
          <div class="hist-meta">${fmtDate(h.date)}</div>
        </div>
        <div class="hist-actions">
          <button class="hist-edit" data-edithist="${h.id}" title="Edit entry">✎</button>
          <button class="hist-del" data-delhist="${h.id}" title="Remove entry">✕</button>
        </div>
      </div>`).join('');
    document.getElementById('historyList').innerHTML = rows || `<div class="empty-state">No history recorded yet.</div>`;
    document.getElementById('historyOverlay').classList.add('show');
    document.getElementById('historyPanel').classList.add('show');
    return;
  }

  if(action==='rename'){
    const isStylist = emp.position==='Stylist';
    const hasRank = emp.position==='Counter' || emp.position==='Intern';
    openModal(`
      <h3>Edit Details</h3>
      <div class="modal-sub">Update this employee's real name and contact info.${isStylist? ' Stylists can also set a board display name.':''}</div>
      <div class="field"><label>Real Name</label><input type="text" id="f_name" value="${escapeHtml(emp.name)}" autofocus></div>
      <div class="field"><label>Contact Number</label><input type="text" id="f_contact" value="${escapeHtml(emp.contact||'')}" placeholder="e.g. 0917 123 4567"></div>
      ${isStylist? `
      <div class="field"><label>HS Name</label><input type="text" id="f_hsname" value="${escapeHtml(emp.hsName||'')}" placeholder="board display name"></div>
      <div class="modal-note">If set, this name shows on the branch board instead of her real name — her real name and contact stay recorded here.</div>
      `:''}
      ${hasRank? `
      <div class="field"><label>Rank</label><select id="f_rank">${rankOptionsFor(emp.position, emp.rank)}</select></div>
      `:''}
      <div class="modal-actions"><button class="btn" id="cancelBtn">Cancel</button><button class="btn primary" id="submitBtn">Save</button></div>
    `);
    document.getElementById('cancelBtn').onclick = closeModal;
    document.getElementById('submitBtn').onclick = ()=>{
      const newName = document.getElementById('f_name').value.trim();
      const newContact = document.getElementById('f_contact').value.trim();
      const newHsName = isStylist ? document.getElementById('f_hsname').value.trim() : (emp.hsName||'');
      const newRank = hasRank ? document.getElementById('f_rank').value : (emp.rank||'');
      if(!newName){ flashToast('Enter a name'); return; }
      const old = emp.name;
      const oldContact = emp.contact || '';
      const oldHsName = emp.hsName || '';
      const oldRank = emp.rank || '';
      emp.name = newName; emp.placeholder=false; emp.contact = newContact; emp.hsName = newHsName; emp.rank = newRank;
      const changes = [];
      if(old!==newName) changes.push(`renamed "${old}" to "${newName}"`);
      if(oldContact!==newContact) changes.push('updated contact info');
      if(isStylist && oldHsName!==newHsName) changes.push(newHsName? `HS Name set to "${newHsName}"` : 'HS Name removed');
      if(hasRank && oldRank!==newRank) changes.push(newRank? `rank set to ${newRank}` : 'rank cleared');
      const desc = changes.length? `${newName}: ${changes.join(', ')}.` : `Reviewed details for ${newName}, no changes.`;
      addHistory('Edited', desc, emp.currentBranch);
      addEmpHistory(emp, 'Edited', desc);
      saveState(); render(); closeModal();
    };
    return;
  }

  if(action==='transfer'){
    openModal(`
      <h3>Transfer ${escapeHtml(emp.name)}</h3>
      <div class="modal-sub">Permanently move this employee's home branch. Use this for a permanent reassignment, not a temporary loan.</div>
      <div class="field"><label>New Branch</label><select id="f_branch">${branchOptions(emp.currentBranch)}</select></div>
      <div class="field"><label>Effective Date</label><input type="date" id="f_date" value="${new Date().toISOString().slice(0,10)}"></div>
      <div class="field"><label>Remarks (optional)</label><textarea id="f_remarks" placeholder="reason for transfer"></textarea></div>
      <div class="modal-actions"><button class="btn" id="cancelBtn">Cancel</button><button class="btn primary" id="submitBtn">Confirm Transfer</button></div>
    `);
    document.getElementById('cancelBtn').onclick = closeModal;
    document.getElementById('submitBtn').onclick = ()=>{
      const to = document.getElementById('f_branch').value;
      const remarks = document.getElementById('f_remarks').value.trim();
      const from = emp.currentBranch;
      if(to===from){ flashToast('Choose a different branch'); return; }
      emp.homeBranch = to; emp.currentBranch = to;
      addHistory('Transferred', `${emp.name} transferred from ${from} to ${to}.`, remarks);
      addEmpHistory(emp, 'Transferred', `Transferred from ${from} to ${to}.${remarks? ' '+remarks:''}`);
      autoFillVacancy(to, emp.position);
      saveState(); render(); closeModal();
    };
    return;
  }

  if(action==='borrow'){
    openModal(`
      <h3>Borrow ${escapeHtml(emp.name)}</h3>
      <div class="modal-sub">Temporarily send this employee to another branch. Their home branch stays ${escapeHtml(emp.homeBranch)}, and you can mark them returned later.</div>
      <div class="field"><label>Borrowing Branch</label><select id="f_branch">${branchOptions(emp.currentBranch)}</select></div>
      <div class="field-row">
        <div class="field"><label>Borrowed From</label><input type="date" id="f_from" value="${todayStr()}"></div>
        <div class="field"><label>Expected Until (optional)</label><input type="date" id="f_until"></div>
      </div>
      <div class="field"><label>Remarks (optional)</label><textarea id="f_remarks" placeholder="e.g. covering for pregnant staff"></textarea></div>
      <div class="modal-actions"><button class="btn" id="cancelBtn">Cancel</button><button class="btn primary" id="submitBtn">Confirm Borrow</button></div>
    `);
    document.getElementById('cancelBtn').onclick = closeModal;
    document.getElementById('submitBtn').onclick = ()=>{
      const to = document.getElementById('f_branch').value;
      const fromDate = document.getElementById('f_from').value || todayStr();
      const untilDate = document.getElementById('f_until').value;
      const remarks = document.getElementById('f_remarks').value.trim();
      const from = emp.currentBranch;
      if(to===from){ flashToast('Choose a different branch'); return; }
      emp.currentBranch = to; emp.status='Borrowed'; emp.borrowStart = fromDate; emp.expectedReturn = untilDate;
      const desc = `${emp.name} borrowed by ${to} from ${from}, starting ${fromDate}.${untilDate? ' Expected until '+untilDate+'.':''}`;
      addHistory('Borrowed', desc, remarks);
      addEmpHistory(emp, 'Borrowed', `Borrowed by ${to} from ${from}, starting ${fromDate}.${untilDate? ' Expected until '+untilDate+'.':''}${remarks? ' '+remarks:''}`);
      saveState(); render(); closeModal();
    };
    return;
  }

  if(action==='return'){
    openModal(`
      <h3>Return ${escapeHtml(emp.name)}</h3>
      <div class="modal-sub">Send this employee back to their home branch, ${escapeHtml(emp.homeBranch)}.</div>
      <div class="field"><label>Return Date</label><input type="date" id="f_date" value="${todayStr()}"></div>
      <div class="modal-actions"><button class="btn" id="cancelBtn">Cancel</button><button class="btn primary" id="submitBtn">Confirm Return</button></div>
    `);
    document.getElementById('cancelBtn').onclick = closeModal;
    document.getElementById('submitBtn').onclick = ()=>{
      const returnDate = document.getElementById('f_date').value || todayStr();
      const from = emp.currentBranch;
      const totalDays = emp.borrowStart ? daysBetween(emp.borrowStart, returnDate) : null;
      const desc = `${emp.name} returned to ${emp.homeBranch} from ${from}.` + (totalDays? ` Borrowed ${emp.borrowStart} → ${returnDate} (${totalDays} day${totalDays===1?'':'s'}).` : '');
      emp.currentBranch = emp.homeBranch; emp.status='Active'; delete emp.expectedReturn; delete emp.borrowStart;
      addHistory('Returned', desc, '');
      addEmpHistory(emp, 'Returned', desc);
      saveState(); render(); closeModal();
    };
    return;
  }

  if(action==='awol'){
    openModal(`
      <h3>Mark AWOL</h3>
      <div class="modal-sub">${escapeHtml(emp.name)} will be removed from active headcount at ${escapeHtml(emp.currentBranch)} until reported back.</div>
      <div class="field"><label>AWOL Since</label><input type="date" id="f_date" value="${todayStr()}"></div>
      <div class="field"><label>Remarks (optional)</label><textarea id="f_remarks" placeholder="details"></textarea></div>
      <div class="modal-actions"><button class="btn" id="cancelBtn">Cancel</button><button class="btn danger" id="submitBtn">Confirm AWOL</button></div>
    `);
    document.getElementById('cancelBtn').onclick = closeModal;
    document.getElementById('submitBtn').onclick = ()=>{
      const date = document.getElementById('f_date').value || todayStr();
      const remarks = document.getElementById('f_remarks').value.trim();
      emp.status='AWOL'; emp.dateAwol = date;
      const desc = `${emp.name} marked AWOL from ${emp.currentBranch}, since ${date}.`;
      addHistory('AWOL', desc, remarks);
      addEmpHistory(emp, 'AWOL', desc + (remarks? ' '+remarks:''));
      saveState(); render(); closeModal();
    };
    return;
  }

  if(action==='backfromawol'){
    openModal(`
      <h3>Report ${escapeHtml(emp.name)} Back</h3>
      <div class="modal-sub">Restore this employee to active headcount at ${escapeHtml(emp.currentBranch)}.</div>
      <div class="field"><label>Date Reported Back</label><input type="date" id="f_date" value="${todayStr()}"></div>
      <div class="modal-actions"><button class="btn" id="cancelBtn">Cancel</button><button class="btn primary" id="submitBtn">Confirm</button></div>
    `);
    document.getElementById('cancelBtn').onclick = closeModal;
    document.getElementById('submitBtn').onclick = ()=>{
      const date = document.getElementById('f_date').value || todayStr();
      const daysAwol = emp.dateAwol ? daysBetween(emp.dateAwol, date) : null;
      const desc = `${emp.name} reported back to ${emp.currentBranch}.` + (daysAwol? ` AWOL ${emp.dateAwol} → ${date} (${daysAwol} day${daysAwol===1?'':'s'}).` : '');
      emp.status='Active'; delete emp.dateAwol;
      addHistory('ReportedBack', desc, '');
      addEmpHistory(emp, 'ReportedBack', desc);
      saveState(); render(); closeModal();
    };
    return;
  }

  if(action==='oic'){
    openModal(`
      <h3>Mark OIC</h3>
      <div class="modal-sub">${escapeHtml(emp.name)}'s name will show highlighted as Officer-in-Charge.</div>
      <div class="field"><label>Date Assigned</label><input type="date" id="f_date" value="${todayStr()}"></div>
      <div class="field"><label>Remarks (optional)</label><textarea id="f_remarks" placeholder="e.g. covering while BM on leave"></textarea></div>
      <div class="modal-actions"><button class="btn" id="cancelBtn">Cancel</button><button class="btn primary" id="submitBtn">Confirm</button></div>
    `);
    document.getElementById('cancelBtn').onclick = closeModal;
    document.getElementById('submitBtn').onclick = ()=>{
      const date = document.getElementById('f_date').value || todayStr();
      const remarks = document.getElementById('f_remarks').value.trim();
      emp.oic = true; emp.oicSince = date;
      const desc = `${emp.name} marked OIC at ${emp.currentBranch}, since ${date}.`;
      addHistory('OIC', desc, remarks);
      addEmpHistory(emp, 'OIC', desc + (remarks? ' '+remarks:''));
      saveState(); render(); closeModal();
    };
    return;
  }

  if(action==='unoic'){
    openModal(`
      <h3>Remove OIC</h3>
      <div class="modal-sub">Remove the OIC highlight from ${escapeHtml(emp.name)}'s name.</div>
      <div class="modal-actions"><button class="btn" id="cancelBtn">Cancel</button><button class="btn primary" id="submitBtn">Confirm</button></div>
    `);
    document.getElementById('cancelBtn').onclick = closeModal;
    document.getElementById('submitBtn').onclick = ()=>{
      emp.oic = false; delete emp.oicSince;
      const desc = `${emp.name} removed as OIC.`;
      addHistory('Edited', desc, '');
      addEmpHistory(emp, 'Edited', desc);
      saveState(); render(); closeModal();
    };
    return;
  }

  if(action==='pregnant'){
    openModal(`
      <h3>Mark Pregnant</h3>
      <div class="modal-sub">${escapeHtml(emp.name)}'s name will show highlighted so the branch knows to plan coverage.</div>
      <div class="field"><label>Date Noted</label><input type="date" id="f_date" value="${todayStr()}"></div>
      <div class="field"><label>Remarks (optional)</label><textarea id="f_remarks" placeholder="e.g. due date, light duty notes"></textarea></div>
      <div class="modal-actions"><button class="btn" id="cancelBtn">Cancel</button><button class="btn primary" id="submitBtn">Confirm</button></div>
    `);
    document.getElementById('cancelBtn').onclick = closeModal;
    document.getElementById('submitBtn').onclick = ()=>{
      const date = document.getElementById('f_date').value || todayStr();
      const remarks = document.getElementById('f_remarks').value.trim();
      emp.pregnant = true; emp.pregnantSince = date;
      const desc = `${emp.name} marked pregnant, noted ${date}.`;
      addHistory('Pregnant', desc, remarks);
      addEmpHistory(emp, 'Pregnant', desc + (remarks? ' '+remarks:''));
      saveState(); render(); closeModal();
    };
    return;
  }

  if(action==='unpregnant'){
    openModal(`
      <h3>Unmark Pregnant</h3>
      <div class="modal-sub">Remove the pregnant highlight from ${escapeHtml(emp.name)}'s name.</div>
      <div class="modal-actions"><button class="btn" id="cancelBtn">Cancel</button><button class="btn primary" id="submitBtn">Confirm</button></div>
    `);
    document.getElementById('cancelBtn').onclick = closeModal;
    document.getElementById('submitBtn').onclick = ()=>{
      emp.pregnant = false; delete emp.pregnantSince;
      const desc = `${emp.name} unmarked as pregnant.`;
      addHistory('Edited', desc, '');
      addEmpHistory(emp, 'Edited', desc);
      saveState(); render(); closeModal();
    };
    return;
  }

  if(action==='archive'){
    openModal(`
      <h3>Remove ${escapeHtml(emp.name)} From List</h3>
      <div class="modal-sub">She'll no longer appear in the active branch list. Her full record and history move to "Removed Employees" — nothing is deleted, so you can still look her up or rehire her later if she reapplies.</div>
      <div class="modal-actions"><button class="btn" id="cancelBtn">Cancel</button><button class="btn danger" id="submitBtn">Remove From List</button></div>
    `);
    document.getElementById('cancelBtn').onclick = closeModal;
    document.getElementById('submitBtn').onclick = ()=>{
      const idx = state.employees.findIndex(x=>x.id===emp.id);
      if(idx>-1){
        const [removed] = state.employees.splice(idx,1);
        const desc = `${removed.name} removed from active list (archived) from ${removed.currentBranch}.`;
        addEmpHistory(removed, 'Edited', desc);
        state.archivedEmployees.push(removed);
        addHistory('Edited', desc, '');
      }
      saveState(); render(); closeModal();
      flashToast('Moved to Removed Employees');
    };
    return;
  }

  if(action==='resign'){
    openModal(`
      <h3>Mark Resigning</h3>
      <div class="modal-sub">${escapeHtml(emp.name)} is giving notice at ${escapeHtml(emp.currentBranch)}. She'll stay counted as active staff until her last day passes — nothing changes in headcount yet.</div>
      <div class="field"><label>Last Day</label><input type="date" id="f_date" value="${todayStr()}"></div>
      <div class="field"><label>Remarks (optional)</label><textarea id="f_remarks" placeholder="reason, notice given, etc."></textarea></div>
      <div class="modal-actions"><button class="btn" id="cancelBtn">Cancel</button><button class="btn danger" id="submitBtn">Confirm Notice</button></div>
    `);
    document.getElementById('cancelBtn').onclick = closeModal;
    document.getElementById('submitBtn').onclick = ()=>{
      const lastDay = document.getElementById('f_date').value || todayStr();
      const remarks = document.getElementById('f_remarks').value.trim();
      emp.status='Resigning'; emp.lastDay = lastDay;
      const desc = `${emp.name} gave notice at ${emp.currentBranch}, last day ${lastDay}.`;
      addHistory('Resigning', desc, remarks);
      addEmpHistory(emp, 'Resigning', desc + (remarks? ' '+remarks:''));
      saveState(); render(); closeModal();
    };
    return;
  }

  if(action==='confirmresign'){
    openModal(`
      <h3>Confirm Resigned</h3>
      <div class="modal-sub">${escapeHtml(emp.name)}'s last day (${escapeHtml(emp.lastDay||'')}) has come. She'll be removed from active headcount at ${escapeHtml(emp.currentBranch)}.</div>
      <div class="field"><label>Actual Resignation Date</label><input type="date" id="f_date" value="${emp.lastDay || todayStr()}"></div>
      <div class="field"><label>Remarks (optional)</label><textarea id="f_remarks" placeholder="exit notes"></textarea></div>
      <div class="modal-actions"><button class="btn" id="cancelBtn">Cancel</button><button class="btn danger" id="submitBtn">Confirm Resigned</button></div>
    `);
    document.getElementById('cancelBtn').onclick = closeModal;
    document.getElementById('submitBtn').onclick = ()=>{
      const date = document.getElementById('f_date').value || todayStr();
      const remarks = document.getElementById('f_remarks').value.trim();
      emp.status='Resigned'; emp.dateResigned = date; delete emp.lastDay;
      const desc = `${emp.name} resigned from ${emp.currentBranch}, effective ${date}.`;
      addHistory('Resigned', desc, remarks);
      addEmpHistory(emp, 'Resigned', desc + (remarks? ' '+remarks:''));
      saveState(); render(); closeModal();
    };
    return;
  }

  if(action==='cancelresigning'){
    openModal(`
      <h3>Cancel Resigning</h3>
      <div class="modal-sub">${escapeHtml(emp.name)} changed her mind, or her notice was withdrawn. She goes back to Active status.</div>
      <div class="modal-actions"><button class="btn" id="cancelBtn">Cancel</button><button class="btn primary" id="submitBtn">Confirm</button></div>
    `);
    document.getElementById('cancelBtn').onclick = closeModal;
    document.getElementById('submitBtn').onclick = ()=>{
      const desc = `${emp.name}'s resignation notice was cancelled at ${emp.currentBranch}.`;
      emp.status='Active'; delete emp.lastDay;
      addHistory('Edited', desc, '');
      addEmpHistory(emp, 'Edited', desc);
      saveState(); render(); closeModal();
    };
    return;
  }
}

function exportCsv(){
  const rows = [['Employee ID','Name','Contact','HS Name','Position','Rank','Home Branch','Current Branch','Status','Borrow Start','Borrow Until','AWOL Since','Last Day (Notice)','Pregnant','OIC','Date Resigned']];
  state.employees.forEach(e=>{
    rows.push([e.id, e.name, e.contact||'', e.hsName||'', e.position, e.rank||'', e.homeBranch, e.currentBranch, e.status, e.borrowStart||'', e.expectedReturn||'', e.dateAwol||'', e.lastDay||'', e.pregnant?('Yes since '+(e.pregnantSince||'')):'', e.oic?('Yes since '+(e.oicSince||'')):'', e.dateResigned||'']);
  });
  const csv = rows.map(r=>r.map(v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'msl_manpower_export.csv';
  a.click();
  URL.revokeObjectURL(url);
}

loadState();
</script>
